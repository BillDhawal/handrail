<html>

body { font-family: monospace; background: #d8d8d0; margin: 0; padding: 8px; }

table.grid td, table.grid th { border: 1px solid #888; padding: 2px 6px; }

</style>
</head>
<body>
<div class="hdr">PLUMBLINE&nbsp;&nbsp;{{ cfg.institution }}</div>

</body>
</html>

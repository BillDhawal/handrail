</style></head><body><main><h1>Handrail, the governed capability platform</h1><p class="lede">Eleven screens, in the order a person meets them. Concept art, generated 2026-10-31 from the product research; labels inside the images are approximate. Palette and layout are the proposal; nothing here is built.</p><figure><img src="01-dashboard.jpg" alt="1. Home"><figcaption><b>1. Home</b> Where you land. Four numbers that matter: approved capabilities, replays today, model calls on replay (always 0), escalations open. Table of capabilities with lifecycle chip, approver, success rate sparkline, last drift. Right rail: what needs a person now.</figcaption></figure><figure><img src="02-author.jpg" alt="2. Author"><figcaption><b>2. Author</b> The one evening the model drives. Left: the goal and a step rail filling with one card per action, each with a screenshot and an effect chip. Right: the live legacy screen, read-only to you, with the control the model is about to use outlined. Bottom: evidence drawer, chain state, llm_calls counting up. Big Stop, always visible.</figcaption></figure><figure><img src="03-commit-marking.jpg" alt="3. Mark the commits"><figcaption><b>3. Mark the commits</b> Nobody ships this. At the end of authoring every button press is shown and you say which ones cannot be undone. A commit card locks, carries your name, and later needs confirmation to delete.</figcaption></figure><figure><img src="04-review.jpg" alt="4. Review the capability"><figcaption><b>4. Review the capability</b> The compiled card, read only. Lifecycle stepper draft, verified, approved. Version diff in three colours down to the locator ladder. The three verify runs linked. Typed inputs and outputs. Approve button signs as you.</figcaption></figure><figure><img src="11-approval.jpg" alt="5. Approve"><figcaption><b>5. Approve</b> A checklist, not a form: three clean plates, every commit confirmed by name, no secret literals, allowlist shown. Your name and time go into the card. Optional: expose on the catalog.</figcaption></figure><figure><img src="05-run-success.jpg" alt="6. A run"><figcaption><b>6. A run</b> One replay. Status bar carries the four things no competitor can show: llm_calls = 0, hash chain verified, steps completed of total, Retry that knows about commits. Per-step before, action, after. Outputs, masked inputs, journal on the right. Filmstrip below.</figcaption></figure><figure><img src="06-run-failed.jpg" alt="7. A failed run"><figcaption><b>7. A failed run</b> First line answers the question: application problem or capability misconfiguration. Then the exact check that failed, quoted. Then the classifier's proposal, labelled as a proposal. The screenshot at the moment it broke.</figcaption></figure><figure><img src="10-run-history.jpg" alt="8. Run history"><figcaption><b>8. Run history</b> Every run, with result chips in the four categories, version on every row, model calls, who escalated. Filters. Evidence export.</figcaption></figure><figure><img src="07-takeover.jpg" alt="9. Takeover"><figcaption><b>9. Takeover</b> The telephone. Brass banner with the engine's instructions and a timer. Ladder on the left shows what was tried. The live screen gets a border that says who is driving. Hand back must name a screen the run was hoping for. Every exchange goes into the journal.</figcaption></figure><figure><img src="08-drift.jpg" alt="10. Drift"><figcaption><b>10. Drift</b> Which locator rung found each control on each run, the healing rows with a correct or not toggle, the classifier's calibration table. Drift raised even when the run succeeded.</figcaption></figure><figure><img src="09-catalog.jpg" alt="11. Catalog"><figcaption><b>11. Catalog</b> What other agents see over MCP. Only approved cards. Read or Write badge from the commit steps, approver and date, success rate, last drift, Try it, Export. A card cannot be listed without a description and a reliability figure.</figcaption></figure></main></body></html>
